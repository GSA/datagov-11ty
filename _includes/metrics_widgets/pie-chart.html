{% if url %}
<a href="{% link url %}" aria-label="{{ ariaLabel | default: toolTipText }}"
{% if toolTipText %}
  class="metrics__card-link usa-tooltip" data-position="{{ toolTipPosition | default: 'bottom' }}"
  title="{{ toolTipText }}"{% else %}
  class="metrics__card-link"{% endif %}>
{% endif %}
  <div class="metrics__card">
    <canvas
      id="datagov-pie-chart"
      class="datagov-charts {{ class }}"
      data-metric="{{ metric }}">
    </canvas>
  </div>
{% if url %}
</a>
{% endif %}
